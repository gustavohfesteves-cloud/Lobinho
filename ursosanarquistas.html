<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ursos Anarquistas - Slot Tático</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0d0d0d; background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 100%); color: #d9d9d9; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        
        .nav-link { color: #39ff14; text-decoration: none; border: 2px dashed #39ff14; padding: 8px 20px; margin-bottom: 25px; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; transition: all 0.3s ease; background-color: rgba(57, 255, 20, 0.05); }
        .nav-link:hover { background-color: #39ff14; color: #000; box-shadow: 0 0 20px #39ff14; border-style: solid; }
        
        .machine { background: linear-gradient(135deg, #1f1f1f, #0a0a0a); border: 4px solid #ff0000; border-radius: 2px; padding: 30px; text-align: center; box-shadow: 10px 10px 0px rgba(255, 0, 0, 0.4), 0 0 30px rgba(0, 0, 0, 0.9); max-width: 500px; width: 100%; position: relative; }
        .machine::before { content: 'A'; position: absolute; top: -15px; left: -15px; background: #ff0000; color: #000; font-weight: 900; font-size: 24px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 3px solid #000; transform: rotate(-15deg); box-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
        
        h2 { margin: 10px 0 25px 0; font-size: 32px; color: #fff; text-shadow: -2px 2px 0px #ff0000, 2px -2px 0px #39ff14; letter-spacing: 1px; text-transform: uppercase; font-weight: 900; transform: skewX(-5deg); }
        
        .painel-led { background-color: #000; border: 2px solid #333; border-left: 5px solid #ff0000; padding: 15px 20px; margin-bottom: 25px; font-size: 18px; font-weight: bold; color: #39ff14; display: flex; justify-content: space-between; box-shadow: inset 0 0 15px rgba(57, 255, 20, 0.1); }
        .painel-led span:last-child { color: #ff0000; }
        
        .reels-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; background-color: #111; padding: 15px; border: 3px dashed #ff0000; box-shadow: inset 0 0 40px rgba(0, 0, 0, 1); }
        .reel { background-color: #0a0a0a; border: 1px solid #444; height: 110px; background-size: cover; background-position: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.9); position: relative; transition: all 0.2s; filter: contrast(1.2) grayscale(0.2); }
        .reel::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.85); transition: background-color 0.3s; pointer-events: none; }
        .reel.active::after { background-color: rgba(0, 0, 0, 0); box-shadow: inset 0 0 25px rgba(255, 0, 0, 0.4); border: 2px solid #ff0000; }
        
        .botoes-aposta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        button { padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: 900; cursor: pointer; border: 2px solid #333; background: #111; color: #888; text-transform: uppercase; transition: all 0.1s ease; letter-spacing: 1px; }
        button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; background: #000; color: #fff; border-color: #ff0000; }
        button:disabled { background: #050505; color: #333; border-color: #111; cursor: not-allowed; }
        
        .btn-girar { grid-column: span 2; background: #ff0000; color: #000; font-size: 22px; border: 2px solid #000; box-shadow: 5px 5px 0px #39ff14; }
        .btn-girar:active:not(:disabled) { background: #cc0000; box-shadow: 2px 2px 0px #39ff14; transform: translate(3px, 3px); }
        
        #status { font-size: 15px; min-height: 45px; color: #fff; background-color: #000; padding: 12px; border: 2px solid #333; border-right: 5px solid #39ff14; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <a href="index.html" class="nav-link">[ DEPARTAMENTO CENTRAL ]</a>

    <div class="machine">
        <h2>URSOS ANARQUISTAS</h2>
        
        <div class="painel-led">
            <span>FUNDO: R$ <span id="saldo">0.00</span></span>
            <span>CUSTO: R$ <span id="aposta-display">0.20</span></span>
        </div>

        <div class="reels-container" id="grid">
            <div class="reel active" id="c0"></div><div class="reel active" id="c1"></div><div class="reel active" id="c2"></div>
            <div class="reel active" id="c3"></div><div class="reel active" id="c4"></div><div class="reel active" id="c5"></div>
            <div class="reel active" id="c6"></div><div class="reel active" id="c7"></div><div class="reel active" id="c8"></div>
        </div>

        <div class="botoes-aposta">
            <button onclick="setAposta(0.20, 1)">MOTIM 1 (1 L)</button>
            <button onclick="setAposta(0.40, 2)">MOTIM 2 (2 L)</button>
            <button onclick="setAposta(0.80, 4)">MOTIM 3 (4 L)</button>
            <button onclick="setAposta(1.60, 8)">CAOS TOTAL (8 L)</button>
            <button class="btn-girar" id="btn-spin" onclick="iniciarGiro()" disabled>QUEBRAR O SISTEMA</button>
        </div>

        <div id="status">ESTABELECENDO CONEXÃO TÁTICA...</div>
    </div>

    <script>
        // REDE E AUTENTICAÇÃO
        const KEY_EMAIL = 'cassino_user_email';
        const KEY_SENHA = 'cassino_user_senha';
        let saldoCloud = 0.00;

        async function api(operacao, corpo = {}) {
            const email = localStorage.getItem(KEY_EMAIL);
            const senha = localStorage.getItem(KEY_SENHA);
            if (!email || !senha) {
                window.location.href = 'index.html';
                return { ok: false };
            }
            const res = await fetch('/api/defesa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ operacao, email, senha, ...corpo })
            });
            return { ok: res.ok, data: await res.json() };
        }

        // SINTETIZADOR DE ÁUDIO (Ajustado para sonoridade Grunge/Punk)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function gerarBip(frequencia, tipo, duracao, volume) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscilador = audioCtx.createOscillator();
            const ganho = audioCtx.createGain();
            oscilador.type = tipo;
            oscilador.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
            ganho.gain.setValueAtTime(volume, audioCtx.currentTime);
            ganho.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
            oscilador.connect(ganho);
            ganho.connect(audioCtx.destination);
            oscilador.start();
            oscilador.stop(audioCtx.currentTime + duracao);
        }

        function somGiroEixo() { gerarBip(150, 'sawtooth', 0.08, 0.05); }
        function somFalha() { gerarBip(60, 'square', 0.5, 0.08); }
        function somPremioVicio() {
            const notas = [329.63, 440.00, 523.25, 659.25];
            let atraso = 0;
            notas.forEach(freq => { setTimeout(() => gerarBip(freq, 'sawtooth', 0.2, 0.1), atraso); atraso += 100; });
            setTimeout(() => gerarBip(880.00, 'square', 0.8, 0.1), atraso + 100);
        }

        // MOTOR MATEMÁTICO (Calibrado para exatos 45.14% RTP)
        const rngEngine = [
            ...Array(44).fill('ursocereja.jpeg'), ...Array(26).fill('ursolimao.jpeg'),
            ...Array(15).fill('ursoameixa.jpeg'), ...Array(8).fill('ursosino.jpeg'),
            ...Array(4).fill('ursobar.jpeg'),     ...Array(2).fill('ursosete.jpeg'),
            ...Array(1).fill('ursodiamante.jpeg')
        ];

        const pagamentos = { 'ursodiamante.jpeg': 500, 'ursosete.jpeg': 100, 'ursobar.jpeg': 50, 'ursosino.jpeg': 20, 'ursoameixa.jpeg': 12, 'ursolimao.jpeg': 8, 'ursocereja.jpeg': 3 };
        const linhasPagamento = [ [3, 4, 5], [0, 1, 2], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6] ];

        let apostaAtual = 0.20;
        let linhasAtivas = 1;
        let girando = false;

        function setAposta(valor, linhas) {
            if (girando) return;
            apostaAtual = valor;
            linhasAtivas = linhas;
            document.getElementById('aposta-display').innerText = apostaAtual.toFixed(2);
            document.getElementById('status').innerText = `MODO DE VARREDURA: ${linhas} LINHA(S).`;
        }

        function sortear() { return rngEngine[Math.floor(Math.random() * rngEngine.length)]; }

        async function iniciarGiro() {
            if (girando) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const status = document.getElementById('status');

            if (saldoCloud < apostaAtual) {
                status.innerText = "FUNDO TÁTICO INSUFICIENTE.";
                somFalha();
                return;
            }

            for(let i=0; i<9; i++) document.getElementById('c'+i).classList.add('active');

            saldoCloud -= apostaAtual;
            document.getElementById('saldo').innerText = saldoCloud.toFixed(2);
            girando = true;
            document.getElementById('btn-spin').disabled = true;
            status.innerText = "ESPALHANDO O CAOS...";

            api('atualizar_saldo', { novoSaldo: saldoCloud });

            let tempo = 0;
            const intervalo = setInterval(() => {
                for(let i = 0; i < 9; i++) {
                    document.getElementById('c'+i).style.backgroundImage = `url('${sortear()}')`;
                }
                somGiroEixo(); 
                tempo += 50;

                if (tempo >= 1200) {
                    clearInterval(intervalo);
                    verificarVitorias();
                }
            }, 50);
        }

        function verificarVitorias() {
            let premioTotal = 0;
            const linhasGanhas = new Set();
            const gridFinal = [];

            for(let i = 0; i < 9; i++) {
                let bgInfo = document.getElementById('c'+i).style.backgroundImage;
                gridFinal.push(bgInfo.replace(/^url\(["']?/, '').replace(/["']?\)$/, ''));
            }

            for(let i = 0; i < linhasAtivas; i++) {
                const [p1, p2, p3] = linhasPagamento[i];
                if (gridFinal[p1] === gridFinal[p2] && gridFinal[p2] === gridFinal[p3]) {
                    premioTotal += (pagamentos[gridFinal[p1]] * 0.20);
                    linhasGanhas.add(p1); linhasGanhas.add(p2); linhasGanhas.add(p3);
                }
            }

            for(let i=0; i<9; i++) {
                if(!linhasGanhas.has(i) && linhasGanhas.size > 0) document.getElementById('c'+i).classList.remove('active');
                else if (linhasGanhas.size === 0) document.getElementById('c'+i).classList.remove('active');
            }

            const status = document.getElementById('status');
            if (premioTotal > 0) {
                saldoCloud += premioTotal;
                document.getElementById('saldo').innerText = saldoCloud.toFixed(2);
                status.innerText = `SAQUE EXECUTADO! TRANSFERINDO R$ ${premioTotal.toFixed(2)}`;
                status.style.color = "#39ff14";
                somPremioVicio();
                api('atualizar_saldo', { novoSaldo: saldoCloud });
            } else {
                status.innerText = "SISTEMA SE DEFENDEU. TENTE NOVAMENTE.";
                status.style.color = "#ff0000";
            }

            girando = false;
            document.getElementById('btn-spin').disabled = false;
        }

        window.onload = async () => {
            for(let i=0; i<9; i++) document.getElementById('c'+i).style.backgroundImage = `url('ursocereja.jpeg')`;
            
            const { ok, data } = await api('ler_saldo');
            if (ok) {
                saldoCloud = data.saldo;
                document.getElementById('saldo').innerText = saldoCloud.toFixed(2);
                document.getElementById('status').innerText = "MÁQUINA ARMADA. AGUARDANDO ORDEM.";
                document.getElementById('btn-spin').disabled = false;
            } else {
                document.getElementById('status').innerText = "FALHA DE CONEXÃO. RETORNE AO MENU.";
                document.getElementById('status').style.color = "#ff0000";
            }
        };
    </script>
</body>
</html>
