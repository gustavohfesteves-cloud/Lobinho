<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Desenvolvedor - Override</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #000; color: #0f0; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .terminal { background-color: #050505; border: 2px solid #33ff33; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 0 20px rgba(51, 255, 51, 0.2); }
        h2 { margin-top: 0; color: #fff; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px dashed #33ff33; padding-bottom: 10px; }
        .input-dev { width: 100%; padding: 12px; font-size: 14px; font-family: inherit; background-color: #111; color: #0f0; border: 1px solid #33ff33; margin-bottom: 15px; box-sizing: border-box; }
        .btn-override { width: 100%; padding: 15px; font-weight: bold; font-size: 16px; font-family: inherit; cursor: pointer; text-transform: uppercase; transition: 0.2s; margin-bottom: 15px; border: none; }
        .btn-detonador { background-color: #ffaa00; color: #000; }
        .btn-injetar { background-color: #33ff33; color: #000; }
        .btn-leitura { background-color: #00aaff; color: #000; }
        .btn-override:hover { background-color: #fff; color: #000; }
        .nav-link { color: #aaa; text-decoration: none; display: block; margin-bottom: 20px; text-transform: uppercase; }
        #log-dev { margin-top: 10px; font-weight: bold; min-height: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

    <a href="index.html" class="nav-link">[ <- RETORNAR AO MENU CENTRAL ]</a>

    <div class="terminal">
        <h2>OVERRIDE DO DESENVOLVEDOR</h2>
        
        <button class="btn-override btn-detonador" onclick="iniciarBanco()">1. INICIALIZAR BANCO DE DADOS NA NUVEM</button>
        
        <label>E-MAIL DO ALVO:</label>
        <input type="email" id="alvo-email" class="input-dev" placeholder="usuario@operacao.com">
        
        <label>NOVO SALDO ABSOLUTO (R$):</label>
        <input type="number" id="alvo-valor" class="input-dev" placeholder="Ex: 500.00" min="0.01" step="0.01">
        
        <button class="btn-override btn-injetar" onclick="injetarFundos()">2. EXECUTAR OVERRIDE DE SALDO</button>
        <button class="btn-override btn-leitura" onclick="lerSaldo()">3. CONSULTAR SALDO DO ALVO</button>
        
        <div id="log-dev">SISTEMA AGUARDANDO COMANDO.</div>
    </div>

    <script>
        const MASTER_EMAIL = 'gustavohfesteves@gmail.com';
        const MASTER_SENHA = 'A0537NaoMeu';

        async function enviarComando(operacao, emailAlvo, novoSaldo = 0) {
            const log = document.getElementById('log-dev');
            log.innerText = "PROCESSANDO CONEXÃO COM A NUVEM...";
            log.style.color = "#fff";

            try {
                const response = await fetch('/api/defesa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        operacao: operacao,
                        emailAutoridade: MASTER_EMAIL,
                        senhaAutoridade: MASTER_SENHA,
                        email: emailAlvo,
                        novoSaldo: novoSaldo
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    log.innerText = `FALHA: ${data.erro}`;
                    log.style.color = "#ff3333";
                    return;
                }

                if (operacao === 'dev_ler_saldo') {
                    log.innerText = `SALDO RETORNADO: R$ ${data.saldo.toFixed(2)}`;
                    log.style.color = "#00aaff";
                } else {
                    log.innerText = `SUCESSO: ${data.status}`;
                    log.style.color = "#33ff33";
                }
            } catch (error) {
                log.innerText = `ERRO CRÍTICO DE REDE: ${error.message}`;
                log.style.color = "#ff3333";
            }
        }

        function iniciarBanco() {
            enviarComando('iniciar_banco', MASTER_EMAIL);
        }

        function injetarFundos() {
            const emailAlvo = document.getElementById('alvo-email').value.trim();
            const valorInjecao = parseFloat(document.getElementById('alvo-valor').value);
            if (!emailAlvo || isNaN(valorInjecao)) {
                document.getElementById('log-dev').innerText = "FALHA: DADOS INVÁLIDOS.";
                return;
            }
            enviarComando('dev_override_saldo', emailAlvo, valorInjecao);
        }

        function lerSaldo() {
            const emailAlvo = document.getElementById('alvo-email').value.trim();
            if (!emailAlvo) {
                document.getElementById('log-dev').innerText = "FALHA: INFORME O ALVO.";
                return;
            }
            enviarComando('dev_ler_saldo', emailAlvo);
        }
    </script>
</body>
</html>
