<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinscher da Rangepsi - Slot Tático</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0d0514; background-image: radial-gradient(circle at top, #1a0a2a 0%, #05020a 100%); color: #e0d0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .nav-link { color: #ff00ff; text-decoration: none; border: 1px solid #ff00ff; padding: 5px 15px; margin-bottom: 20px; text-transform: uppercase; font-weight: bold; letter-spacing: 2px; transition: 0.3s; background-color: rgba(255, 0, 255, 0.1); }
        .nav-link:hover { background-color: #ff00ff; color: #fff; box-shadow: 0 0 10px #ff00ff; }
        .machine { background: linear-gradient(180deg, #2a0a3a, #10051a); border: 6px solid #4a1a5a; border-radius: 4px; padding: 25px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 25px rgba(255,0,255,0.1); max-width: 480px; width: 100%; position: relative; }
        .machine::before { content: ''; position: absolute; top: -6px; left: -6px; right: -6px; height: 10px; background: repeating-linear-gradient(45deg, #00ffff, #00ffff 10px, #000 10px, #000 20px); border-radius: 4px 4px 0 0; }
        h2 { margin: 15px 0 20px 0; font-size: 24px; color: #fff; text-shadow: 2px 2px 0px #000, 0 0 10px #ff00ff, 0 0 20px #00ffff; letter-spacing: 1px; text-transform: uppercase; }
        .painel-led { background-color: #050205; border: 2px solid #8a2be2; padding: 12px 15px; margin-bottom: 25px; font-size: 18px; font-weight: bold; color: #00ffff; text-shadow: 0 0 8px rgba(0, 255, 255, 0.6); display: flex; justify-content: space-between; box-shadow: inset 0 0 15px #000; }
        .reels-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 25px; background-color: #000; padding: 12px; border: 4px solid #2a0a3a; box-shadow: 0 0 15px rgba(255, 0, 255, 0.3); }
        .reel { background-color: #0a050a; border: 1px solid #331133; height: 100px; background-size: cover; background-position: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.9); position: relative; }
        .reel::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.75); transition: background-color 0.2s; pointer-events: none; }
        .reel.active::after { background-color: rgba(0, 0, 0, 0); box-shadow: inset 0 0 25px rgba(255, 0, 255, 0.4); }
        .botoes-aposta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        button { padding: 14px; font-family: inherit; font-size: 13px; font-weight: bold; cursor: pointer; border: 1px solid #5a2a6a; background: linear-gradient(to bottom, #3a1a4a, #1a0a2a); color: #d0a0d0; text-transform: uppercase; box-shadow: 0 3px 5px rgba(0,0,0,0.6); }
        button:active:not(:disabled) { background: #110515; transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.8); color: #8a5a8a; }
        button:disabled { background: #150a1a; color: #442244; border-color: #2a1a3a; cursor: not-allowed; box-shadow: none; }
        .btn-girar { grid-column: span 2; background: linear-gradient(to bottom, #aa00ff, #440088); color: #fff; font-size: 18px; border: 1px solid #ff00ff; letter-spacing: 2px; }
        .btn-girar:active:not(:disabled) { background: #330066; }
        #status { font-size: 13px; min-height: 40px; color: #b090c0; background-color: #0a0510; padding: 10px; border: 1px solid #2a1a3a; text-transform: uppercase; }
    </style>
</head>
<body>

    <a href="index.html" class="nav-link">[ DEPARTAMENTO CENTRAL ]</a>

    <div class="machine">
        <h2>PINSCHER DA RANGEPSI</h2>
        
        <div class="painel-led">
            <span>FUNDO: R$ <span id="saldo">0.00</span></span>
            <span style="color: #ff00ff;">CUSTO: R$ <span id="aposta-display">0.20</span></span>
        </div>

        <div class="reels-container" id="grid">
            <div class="reel active" id="c0"></div><div class="reel active" id="c1"></div><div class="reel active" id="c2"></div>
            <div class="reel active" id="c3"></div><div class="reel active" id="c4"></div><div class="reel active" id="c5"></div>
            <div class="reel active" id="c6"></div><div class="reel active" id="c7"></div><div class="reel active" id="c8"></div>
        </div>

        <div class="botoes-aposta">
            <button onclick="setAposta(0.20, 1)">TÁTICA 1 (1 L)</button>
            <button onclick="setAposta(0.40, 2)">TÁTICA 2 (2 L)</button>
            <button onclick="setAposta(0.80, 4)">TÁTICA 3 (4 L)</button>
            <button onclick="setAposta(1.60, 8)">VARREDURA (8 L)</button>
            <button class="btn-girar" id="btn-spin" onclick="iniciarGiro()" disabled>EXECUTAR</button>
        </div>

        <div id="status">ESTABELECENDO CONEXÃO COM O COFRE...</div>
    </div>

    <script>
        // REDE E AUTENTICAÇÃO
        const KEY_EMAIL = 'cassino_user_email';
        const KEY_SENHA = 'cassino_user_senha';
        let saldoCloud = 0.00;

        async function api(operacao, corpo = {}) {
            const email = localStorage.getItem(KEY_EMAIL);
            const senha = localStorage.getItem(KEY_SENHA);
            if (!email || !senha) {
                window.location.href = 'index.html';
                return { ok: false };
            }
            const res = await fetch('/api/defesa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ operacao, email, senha, ...corpo })
            });
            return { ok: res.ok, data: await res.json() };
        }

        // SINTETIZADOR DE ÁUDIO NATIVO
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function gerarBip(frequencia, tipo, duracao, volume) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscilador = audioCtx.createOscillator();
            const ganho = audioCtx.createGain();
            oscilador.type = tipo;
            oscilador.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
            ganho.gain.setValueAtTime(volume, audioCtx.currentTime);
            ganho.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
            oscilador.connect(ganho);
            ganho.connect(audioCtx.destination);
            oscilador.start();
            oscilador.stop(audioCtx.currentTime + duracao);
        }

        function somGiroEixo() { gerarBip(600, 'square', 0.05, 0.02); }
        function somFalha() { gerarBip(120, 'sawtooth', 0.4, 0.05); }
        function somPremioVicio() {
            const notas = [587.33, 739.99, 880.00, 1174.66];
            let atraso = 0;
            notas.forEach(freq => { setTimeout(() => gerarBip(freq, 'sine', 0.4, 0.1), atraso); atraso += 100; });
            setTimeout(() => gerarBip(1479.98, 'square', 0.6, 0.1), atraso + 100);
        }

        // MOTOR MATEMÁTICO (Arquivos de Imagem do Pinscher - Corrigidos)
        const rngEngine = [
            ...Array(39).fill('pinschercereja.jpeg'), ...Array(28).fill('pinscherlimao.jpeg'),
            ...Array(18).fill('pinscherameixa.jpeg'), ...Array(9).fill('pinschersino.jpeg'),
            ...Array(4).fill('pinscherbar.jpeg'), ...Array(1).fill('pinschersete.jpeg'),
            ...Array(1).fill('pinscherdiamante.jpeg')
        ];

        const pagamentos = { 'pinscherdiamante.jpeg': 500, 'pinschersete.jpeg': 100, 'pinscherbar.jpeg': 50, 'pinschersino.jpeg': 20, 'pinscherameixa.jpeg': 12, 'pinscherlimao.jpeg': 8, 'pinschercereja.jpeg': 3 };
        const linhasPagamento = [ [3, 4, 5], [0, 1, 2], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6] ];

        let apostaAtual = 0.20;
        let linhasAtivas = 1;
        let girando = false;

        function setAposta(valor, linhas) {
            if (girando) return;
            apostaAtual = valor;
            linhasAtivas = linhas;
            document.getElementById('aposta-display').innerText = apostaAtual.toFixed(2);
            document.getElementById('status').innerText = `MODO DE VARREDURA: ${linhas} LINHA(S).`;
        }

        function sortear() { return rngEngine[Math.floor(Math.random() * rngEngine.length)]; }

        async function iniciarGiro() {
            if (girando) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const status = document.getElementById('status');

            if (saldoCloud < apostaAtual) {
                status.innerText = "FUNDO TÁTICO INSUFICIENTE.";
                somFalha();
                return;
            }

            for(let i=0; i<9; i++) document.getElementById('c'+i).classList.add('active');

            saldoCloud -= apostaAtual;
            document.getElementById('saldo').innerText = saldoCloud.toFixed(2);
            girando = true;
            document.getElementById('btn-spin').disabled = true;
            status.innerText = "RASTREANDO ALVOS...";

            api('atualizar_saldo', { novoSaldo: saldoCloud });

            let tempo = 0;
            const intervalo = setInterval(() => {
                for(let i = 0; i < 9; i++) {
                    document.getElementById('c'+i).style.backgroundImage = `url('${sortear()}')`;
                }
                somGiroEixo(); 
                tempo += 50;

                if (tempo >= 1200) {
                    clearInterval(intervalo);
                    verificarVitorias();
                }
            }, 50);
        }

        function verificarVitorias() {
            let premioTotal = 0;
            const linhasGanhas = new Set();
            const gridFinal = [];

            for(let i = 0; i < 9; i++) {
                let bgInfo = document.getElementById('c'+i).style.backgroundImage;
                gridFinal.push(bgInfo.replace(/^url\(["']?/, '').replace(/["']?\)$/, ''));
            }

            for(let i = 0; i < linhasAtivas; i++) {
                const [p1, p2, p3] = linhasPagamento[i];
                if (gridFinal[p1] === gridFinal[p2] && gridFinal[p2] === gridFinal[p3]) {
                    premioTotal += (pagamentos[gridFinal[p1]] * 0.20);
                    linhasGanhas.add(p1); linhasGanhas.add(p2); linhasGanhas.add(p3);
                }
            }

            for(let i=0; i<9; i++) {
                if(!linhasGanhas.has(i) && linhasGanhas.size > 0) document.getElementById('c'+i).classList.remove('active');
                else if (linhasGanhas.size === 0) document.getElementById('c'+i).classList.remove('active');
            }

            const status = document.getElementById('status');
            if (premioTotal > 0) {
                saldoCloud += premioTotal;
                document.getElementById('saldo').innerText = saldoCloud.toFixed(2);
                status.innerText = `ALVO CONFIRMADO. TRANSFERINDO R$ ${premioTotal.toFixed(2)}`;
                somPremioVicio();
                api('atualizar_saldo', { novoSaldo: saldoCloud });
            } else {
                status.innerText = "ALVO PERDIDO. VARREDURA FALHOU.";
            }

            girando = false;
            document.getElementById('btn-spin').disabled = false;
        }

        window.onload = async () => {
            for(let i=0; i<9; i++) document.getElementById('c'+i).style.backgroundImage = `url('pinschercereja.jpeg')`;
            
            const { ok, data } = await api('ler_saldo');
            if (ok) {
                saldoCloud = data.saldo;
                document.getElementById('saldo').innerText = saldoCloud.toFixed(2);
                document.getElementById('status').innerText = "SISTEMA ARMADO. AGUARDANDO ORDEM.";
                document.getElementById('btn-spin').disabled = false;
            } else {
                document.getElementById('status').innerText = "FALHA DE CONEXÃO. RETORNE AO MENU.";
            }
        };
    </script>
</body>
</html>
