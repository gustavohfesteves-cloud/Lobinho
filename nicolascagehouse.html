<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolas Cage House - Cassino Hardcore (Audio Nativo)</title>
    <style>
        body {
            font-family: 'Arial Black', Impact, sans-serif;
            background-color: #050505;
            background-image: linear-gradient(0deg, #000000 0%, #1a1a24 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .nav-link {
            color: #0ff;
            text-decoration: none;
            border: 1px solid #0ff;
            padding: 5px 15px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-family: monospace;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-link:hover {
            background-color: #0ff;
            color: #000;
        }

        .machine {
            background: linear-gradient(145deg, #2a2a35, #111116);
            border: 8px solid #555;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.1);
            max-width: 450px;
            width: 100%;
            border-top-color: #888;
            border-left-color: #777;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 26px;
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00, 0 0 20px #ff0000;
            letter-spacing: 2px;
        }

        .painel-led {
            background-color: #000;
            border: 3px inset #333;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            display: flex;
            justify-content: space-between;
            box-shadow: inset 0 0 10px #050;
        }

        .reels-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            background-color: #111;
            padding: 15px;
            border: 4px inset #444;
            border-radius: 8px;
        }

        .reel {
            background-color: #000;
            border: 2px solid #222;
            height: 95px;
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
        }

        .reel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            transition: background-color 0.3s;
            pointer-events: none;
        }

        .reel.active::after {
            background-color: rgba(0, 0, 0, 0);
            box-shadow: inset 0 0 20px #ffaa00;
        }

        .botoes-aposta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px;
            font-family: 'Arial Black', sans-serif;
            font-size: 14px;
            cursor: pointer;
            border: 2px outset #aaa;
            background: linear-gradient(to bottom, #d4d4d4, #777);
            color: #000;
            text-transform: uppercase;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        button:active:not(:disabled) {
            border-style: inset;
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        button:disabled {
            background: #444;
            color: #777;
            border-color: #333;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-girar {
            grid-column: span 2;
            background: linear-gradient(to bottom, #ff4444, #aa0000);
            color: #fff;
            font-size: 20px;
            border-color: #ff8888;
            text-shadow: 1px 1px 2px #000;
        }
        
        .btn-girar:active:not(:disabled) {
            background: #880000;
        }

        #status {
            font-family: 'Courier New', Courier, monospace;
            margin-top: 10px;
            font-size: 14px;
            min-height: 35px;
            color: #0ff;
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-link">[ VOLTAR ]</a>

    <div class="machine">
        <h2>NICOLAS CAGE HOUSE</h2>
        
        <div class="painel-led">
            <span>SALDO R$ <span id="saldo">5.00</span></span>
            <span style="color: #ff3333;">APOSTA: R$ <span id="aposta-display">0.20</span></span>
        </div>

        <div class="reels-container" id="grid">
            <div class="reel active" id="c0"></div>
            <div class="reel active" id="c1"></div>
            <div class="reel active" id="c2"></div>
            <div class="reel active" id="c3"></div>
            <div class="reel active" id="c4"></div>
            <div class="reel active" id="c5"></div>
            <div class="reel active" id="c6"></div>
            <div class="reel active" id="c7"></div>
            <div class="reel active" id="c8"></div>
        </div>

        <div class="botoes-aposta">
            <button onclick="setAposta(0.20, 1)">R$ 0.20 (1 L)</button>
            <button onclick="setAposta(0.40, 2)">R$ 0.40 (2 L)</button>
            <button onclick="setAposta(0.80, 4)">R$ 0.80 (4 L)</button>
            <button onclick="setAposta(1.60, 8)">R$ 1.60 (8 L)</button>
            <button class="btn-girar" id="btn-spin" onclick="iniciarGiro()">GIRAR</button>
        </div>

        <div id="status">INSERIDO. SELECIONE APOSTA.</div>
    </div>

    <script>
        // SINTETIZADOR DE ÁUDIO NATIVO (WEB AUDIO API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function gerarBip(frequencia, tipo, duracao, volume) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscilador = audioCtx.createOscillator();
            const ganho = audioCtx.createGain();
            
            oscilador.type = tipo;
            oscilador.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
            
            ganho.gain.setValueAtTime(volume, audioCtx.currentTime);
            ganho.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
            
            oscilador.connect(ganho);
            ganho.connect(audioCtx.destination);
            
            oscilador.start();
            oscilador.stop(audioCtx.currentTime + duracao);
        }

        function somGiroEixo() {
            // Clique mecânico tenso
            gerarBip(150 + Math.random() * 50, 'square', 0.05, 0.05);
        }

        function somPremioVicio() {
            // Arpejo de vitória (Acorde Maior ascendente)
            const notas = [440, 554, 659, 880]; // Lá Maior
            let atraso = 0;
            notas.forEach(freq => {
                setTimeout(() => gerarBip(freq, 'sine', 0.3, 0.1), atraso);
                atraso += 80;
            });
            setTimeout(() => gerarBip(1108, 'sine', 0.6, 0.15), atraso + 100);
        }

        function somFalha() {
            gerarBip(110, 'sawtooth', 0.3, 0.05);
        }

        // MATEMÁTICA E LÓGICA DA CASSANÍQUEL (RTP 35%)
        const rngEngine = [
            ...Array(33).fill('nicolascereja.jpeg'),
            ...Array(24).fill('nicolaslimao.jpeg'),
            ...Array(18).fill('nicolasameixa.jpeg'),
            ...Array(12).fill('nicolassino.jpeg'),
            ...Array(7).fill('nicolasbar.jpeg'),
            ...Array(4).fill('nicolassete.jpeg'),
            ...Array(2).fill('nicolasdiamante.jpeg')
        ];

        const pagamentos = {
            'nicolasdiamante.jpeg': 500,
            'nicolassete.jpeg': 100,
            'nicolasbar.jpeg': 50,
            'nicolassino.jpeg': 20,
            'nicolasameixa.jpeg': 12,
            'nicolaslimao.jpeg': 8,
            'nicolascereja.jpeg': 3
        };

        const linhasPagamento = [
            [3, 4, 5], [0, 1, 2], [6, 7, 8], [0, 3, 6], 
            [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6] 
        ];

        let saldo = 5.00;
        let apostaAtual = 0.20;
        let linhasAtivas = 1;
        let girando = false;

        function setAposta(valor, linhas) {
            if (girando) return;
            apostaAtual = valor;
            linhasAtivas = linhas;
            document.getElementById('aposta-display').innerText = apostaAtual.toFixed(2);
            document.getElementById('status').innerText = `MODO: ${linhas} LINHAS ATIVAS.`;
        }

        function sortear() {
            return rngEngine[Math.floor(Math.random() * rngEngine.length)];
        }

        function iniciarGiro() {
            if (girando) return;
            
            // Destrava o áudio no primeiro clique
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const status = document.getElementById('status');

            if (saldo < apostaAtual) {
                status.innerText = "CRÉDITO INSUFICIENTE.";
                somFalha();
                return;
            }

            for(let i=0; i<9; i++) {
                document.getElementById('c'+i).classList.add('active');
            }

            saldo -= apostaAtual;
            document.getElementById('saldo').innerText = saldo.toFixed(2);
            girando = true;
            document.getElementById('btn-spin').disabled = true;
            status.innerText = "PROCESSANDO RNG...";

            let tempo = 0;
            const intervalo = setInterval(() => {
                for(let i = 0; i < 9; i++) {
                    document.getElementById('c'+i).style.backgroundImage = `url('${sortear()}')`;
                }
                somGiroEixo(); // Toca o som mecânico a cada atualização visual
                tempo += 50;

                if (tempo >= 1200) {
                    clearInterval(intervalo);
                    verificarVitorias();
                }
            }, 50);
        }

        function verificarVitorias() {
            let premioTotal = 0;
            const linhasGanhas = new Set();
            const gridFinal = [];

            for(let i = 0; i < 9; i++) {
                let bgInfo = document.getElementById('c'+i).style.backgroundImage;
                let fileName = bgInfo.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
                gridFinal.push(fileName);
            }

            for(let i = 0; i < linhasAtivas; i++) {
                const [p1, p2, p3] = linhasPagamento[i];
                const s1 = gridFinal[p1];
                const s2 = gridFinal[p2];
                const s3 = gridFinal[p3];

                if (s1 === s2 && s2 === s3) {
                    premioTotal += (pagamentos[s1] * 0.20);
                    linhasGanhas.add(p1);
                    linhasGanhas.add(p2);
                    linhasGanhas.add(p3);
                }
            }

            for(let i=0; i<9; i++) {
                if(!linhasGanhas.has(i) && linhasGanhas.size > 0) {
                    document.getElementById('c'+i).classList.remove('active');
                } else if (linhasGanhas.size === 0) {
                    document.getElementById('c'+i).classList.remove('active');
                }
            }

            const status = document.getElementById('status');
            if (premioTotal > 0) {
                saldo += premioTotal;
                document.getElementById('saldo').innerText = saldo.toFixed(2);
                status.innerText = `VITÓRIA! GANHOU R$ ${premioTotal.toFixed(2)}`;
                somPremioVicio(); // Dispara o arpejo de recompensa
            } else {
                status.innerText = "FALHA. A BANCA VENCE.";
            }

            girando = false;
            document.getElementById('btn-spin').disabled = false;
        }

        window.onload = () => {
            for(let i=0; i<9; i++) {
                document.getElementById('c'+i).style.backgroundImage = `url('nicolascereja.jpeg')`;
            }
        };
    </script>
</body>
</html>
