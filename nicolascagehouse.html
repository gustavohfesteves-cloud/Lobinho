<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolas Cage House</title>
    <style>
        /* CSS Minimalista e Tático */
        body {
            font-family: monospace;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff;
            padding: 5px 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .machine {
            border: 4px solid #fff;
            padding: 20px;
            background-color: #222;
            text-align: center;
        }

        .reels {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .reel {
            width: 100px;
            height: 100px;
            border: 2px solid #fff;
            background-color: #000;
            background-size: cover;
            background-position: center;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            background-color: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:active {
            background-color: #aaa;
        }

        #status {
            margin-top: 20px;
            font-size: 16px;
            min-height: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Rota plana de retorno ao menu principal -->
    <a href="index.html" class="nav-link">[ VOLTAR AO MENU ]</a>

    <div class="machine">
        <h2>NICOLAS CAGE HOUSE</h2>
        
        <div class="reels">
            <!-- Os IDs representam os 3 tambores da máquina -->
            <div class="reel" id="r1"></div>
            <div class="reel" id="r2"></div>
            <div class="reel" id="r3"></div>
        </div>

        <button onclick="spin()">Girar / Spin</button>
        <div id="status">Aguardando comando...</div>
    </div>

    <script>
        // Array tático com a nomenclatura solicitada.
        // O sistema espera que esses arquivos estejam na raiz (mesmo diretório do .html)
        const symbols = [
            'nicolascereja.jpeg',
            'nicolaslimao.jpeg',
            'nicolasameixa.jpeg',
            'nicolassino.jpeg',
            'nicolasbar.jpeg',
            'nicolassete.jpeg',
            'nicolasdiamante.jpeg'
        ];

        function spin() {
            const status = document.getElementById('status');
            status.innerText = "PROCESSANDO...";

            // Sorteio RNG (Random Number Generator) básico para os 3 tambores
            const result = [
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)],
                symbols[Math.floor(Math.random() * symbols.length)]
            ];

            // Injeta as imagens nos elementos HTML
            document.getElementById('r1').style.backgroundImage = `url(${result[0]})`;
            document.getElementById('r2').style.backgroundImage = `url(${result[1]})`;
            document.getElementById('r3').style.backgroundImage = `url(${result[2]})`;

            // Lógica mínima de alinhamento visual (sem cálculo de crédito ainda)
            if (result[0] === result[1] && result[1] === result[2]) {
                status.innerText = "ALINHAMENTO TOTAL. JACKPOT.";
            } else if (result[0] === result[1] || result[1] === result[2] || result[0] === result[2]) {
                status.innerText = "ALINHAMENTO PARCIAL.";
            } else {
                status.innerText = "FALHA. TENTE NOVAMENTE.";
            }
        }

        // Executa um giro inicial ao carregar a página para preencher os tambores
        window.onload = spin;
    </script>

</body>
</html>
