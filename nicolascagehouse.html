<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolas Cage House - Caça-Níqueis</title>
    <style>
        body {
            font-family: monospace;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff;
            padding: 5px 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .machine {
            border: 4px solid #fff;
            padding: 20px;
            background-color: #222;
            text-align: center;
        }

        .painel-financeiro {
            font-size: 20px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #0f0;
            color: #0f0;
        }

        .reels {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .reel {
            width: 100px;
            height: 100px;
            border: 2px solid #fff;
            background-color: #000;
            background-size: cover;
            background-position: center;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            background-color: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:active {
            background-color: #aaa;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-size: 16px;
            min-height: 40px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-link">[ VOLTAR AO MENU ]</a>

    <div class="machine">
        <h2>NICOLAS CAGE HOUSE</h2>
        
        <div class="painel-financeiro">
            SALDO: R$ <span id="saldo">5.00</span>
        </div>

        <div class="reels">
            <div class="reel" id="r1"></div>
            <div class="reel" id="r2"></div>
            <div class="reel" id="r3"></div>
        </div>

        <button id="btn-spin" onclick="iniciarGiro()">Girar / Aposta: R$ 1.00</button>
        <div id="status">INSERIDO SALDO INICIAL.<br>AGUARDANDO GIRO.</div>
    </div>

    <script>
        const symbols = [
            'nicolascereja.jpeg',
            'nicolaslimao.jpeg',
            'nicolasameixa.jpeg',
            'nicolassino.jpeg',
            'nicolasbar.jpeg',
            'nicolassete.jpeg',
            'nicolasdiamante.jpeg'
        ];

        let saldo = 5.00;
        const custoAposta = 1.00;
        let girando = false;

        function atualizarPainel() {
            document.getElementById('saldo').innerText = saldo.toFixed(2);
        }

        function sortearSimbolo() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function iniciarGiro() {
            if (girando) return;
            
            const status = document.getElementById('status');

            if (saldo < custoAposta) {
                status.innerHTML = "SALDO INSUFICIENTE.<br>GAME OVER.";
                return;
            }

            // Deduz a aposta
            saldo -= custoAposta;
            atualizarPainel();
            girando = true;
            document.getElementById('btn-spin').disabled = true;
            status.innerHTML = "PROCESSANDO...";

            // Simulação de giro mecânico (roleta)
            let tempoGiro = 0;
            const intervalo = setInterval(() => {
                document.getElementById('r1').style.backgroundImage = `url(${sortearSimbolo()})`;
                document.getElementById('r2').style.backgroundImage = `url(${sortearSimbolo()})`;
                document.getElementById('r3').style.backgroundImage = `url(${sortearSimbolo()})`;
                tempoGiro += 100;

                // Para o giro após 2 segundos
                if (tempoGiro >= 2000) {
                    clearInterval(intervalo);
                    finalizarGiro();
                }
            }, 100);
        }

        function finalizarGiro() {
            const r1 = sortearSimbolo();
            const r2 = sortearSimbolo();
            const r3 = sortearSimbolo();

            document.getElementById('r1').style.backgroundImage = `url(${r1})`;
            document.getElementById('r2').style.backgroundImage = `url(${r2})`;
            document.getElementById('r3').style.backgroundImage = `url(${r3})`;

            calcularPremio(r1, r2, r3);
            
            girando = false;
            document.getElementById('btn-spin').disabled = false;
        }

        function calcularPremio(s1, s2, s3) {
            const status = document.getElementById('status');
            let premio = 0;
            
            // Contagem das cerejas (único símbolo que paga fora da trinca)
            let contagemCereja = [s1, s2, s3].filter(s => s === 'nicolascereja.jpeg').length;

            if (s1 === s2 && s2 === s3) {
                // Alinhamento Triplo (Trinca)
                switch(s1) {
                    case 'nicolasdiamante.jpeg': premio = 1000.00; break;
                    case 'nicolassete.jpeg': premio = 100.00; break;
                    case 'nicolasbar.jpeg': premio = 50.00; break;
                    case 'nicolassino.jpeg': premio = 20.00; break;
                    case 'nicolaslimao.jpeg': 
                    case 'nicolasameixa.jpeg': premio = 10.00; break;
                    case 'nicolascereja.jpeg': premio = 10.00; break;
                }
                status.innerHTML = `TRINCA PERFEITA!<br>GANHOU R$ ${premio.toFixed(2)}`;
            } else if (contagemCereja > 0) {
                // Pagamento parcial de cerejas
                if (contagemCereja === 1) premio = 2.00;
                if (contagemCereja === 2) premio = 5.00;
                status.innerHTML = `CEREJA DETECTADA.<br>GANHOU R$ ${premio.toFixed(2)}`;
            } else {
                status.innerHTML = "FALHA.<br>NENHUM ALINHAMENTO.";
            }

            if (premio > 0) {
                saldo += premio;
                atualizarPainel();
            }
        }

        // Exibição inicial
        window.onload = () => {
            document.getElementById('r1').style.backgroundImage = `url(${symbols[0]})`;
            document.getElementById('r2').style.backgroundImage = `url(${symbols[0]})`;
            document.getElementById('r3').style.backgroundImage = `url(${symbols[0]})`;
            atualizarPainel();
        };
    </script>
</body>
</html>
